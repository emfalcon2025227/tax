name: Production CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Validate embedded HTML JavaScript
        run: npm run check:html

      - name: Build
        run: npm run build

      - name: Validate server bundle
        run: node --check dist/server.cjs
